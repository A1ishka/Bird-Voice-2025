dependencies {
    // AndroidX core & UI
    implementation("androidx.core:core-ktx:1.17.0")
    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation("com.google.android.material:material:1.13.0")
    implementation("androidx.constraintlayout:constraintlayout:2.2.0")
    implementation("androidx.recyclerview:recyclerview:1.4.0")
    implementation("androidx.viewpager2:viewpager2:1.1.0-beta02") // стабильного >1.0.0 нет
    implementation("androidx.activity:activity-ktx:1.11.0")
    implementation("androidx.fragment:fragment-ktx:1.8.9")

    // Навигация
    implementation("androidx.navigation:navigation-fragment-ktx:2.9.5")
    implementation("androidx.navigation:navigation-ui-ktx:2.9.5")

    // Coroutines (совместимо с Kotlin 2.x)
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2")

    // Networking
    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.12.0"))
    implementation("com.squareup.okhttp3:okhttp")                 // версия придет из BOM
    implementation("com.squareup.okhttp3:logging-interceptor")
    implementation("com.squareup.retrofit2:retrofit:2.11.0")
    implementation("com.squareup.retrofit2:converter-gson:2.11.0")

    // Изображения / анимации
    implementation("io.coil-kt:coil:2.7.0")       // (Coil 3.x уже есть, но это крупное обновление)
    // implementation("io.coil-kt:coil:3.3.0")    // если готовы мигрировать на 3.x
    implementation("com.squareup.picasso:picasso:2.8")
    implementation("com.airbnb.android:lottie:6.5.0")

    // DataStore
    implementation("androidx.datastore:datastore-preferences:1.1.7")

    // Lifecycle
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6")
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")

    // Room
    implementation("androidx.room:room-runtime:2.6.1")
    implementation("androidx.room:room-ktx:2.6.1")
    ksp("androidx.room:room-compiler:2.6.1")

    // Google Play services
    implementation("com.google.android.gms:play-services-maps:19.2.0")
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation("com.google.android.gms:play-services-auth:21.2.0")

    // Multidex
    implementation("androidx.multidex:multidex:2.0.1")

    // Firebase через BoM
    implementation(platform("com.google.firebase:firebase-bom:34.3.0"))
    implementation("com.google.firebase:firebase-auth")
    implementation ("androidx.credentials:credentials:1.3.0")              // Credential Manager
    implementation ("androidx.credentials:credentials-play-services-auth:1.3.0") // мост для GMS
    implementation ("com.google.android.libraries.identity.googleid:googleid:1.1.1")

    // MaterialDrawer
    implementation("com.mikepenz:materialdrawer:7.0.0")

    // Tests
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.0")             // или 1.3.0-beta01
    androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
}